# --- GNOME EXTENSION ---

- name: Create extensions directory
  file:
    path: "{{ s2t_target_home }}/.local/share/gnome-shell/extensions/s2t-toggle@local"
    state: directory
    mode: '0755'
    owner: "{{ s2t_target_user }}"
    group: "{{ s2t_target_user }}"

- name: Install extension files
  copy:
    src: "gnome-extension/{{ item }}"
    dest: "{{ s2t_target_home }}/.local/share/gnome-shell/extensions/s2t-toggle@local/{{ item }}"
    mode: '0644'
    owner: "{{ s2t_target_user }}"
    group: "{{ s2t_target_user }}"
  loop:
    - metadata.json
    - extension.js

- name: Ensure autostart directory exists
  file:
    path: "{{ s2t_target_home }}/.config/autostart"
    state: directory
    mode: "0755"
    owner: "{{ s2t_target_user }}"
    group: "{{ s2t_target_user }}"
  when: not s2t_skip_service_enable

- name: Install autostart entry to import graphical session env into systemd user
  copy:
    src: "s2t-env-import.desktop"
    dest: "{{ s2t_target_home }}/.config/autostart/s2t-env-import.desktop"
    mode: "0644"
    owner: "{{ s2t_target_user }}"
    group: "{{ s2t_target_user }}"
  when: not s2t_skip_service_enable

- name: Enable GNOME extension
  command: gnome-extensions enable s2t-toggle@local
  become_user: "{{ s2t_target_user }}"
  environment:
    HOME: "{{ s2t_target_home }}"
    XDG_DATA_HOME: "{{ s2t_target_home }}/.local/share"
  register: s2t_gnome_enable
  changed_when: false
  failed_when: false
  when: not s2t_skip_service_enable
