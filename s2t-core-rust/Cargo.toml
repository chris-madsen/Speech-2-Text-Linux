[package]
name = "s2t-core-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
cpal = "0.15"
opus = "0.3"
ogg = "0.9"
evdev = { version = "0.12", features = ["tokio"] }
x11rb = { version = "0.13", features = ["xtest"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
clap = { version = "4.0", features = ["derive"] }
futures-util = "0.3"
base64 = "0.22"
bytes = "1.0"
url = "2.5"
http = "1.0"
async-stream = "0.3"
tokio-stream = "0.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.7"

[build-dependencies]
tonic-build = "0.12"
